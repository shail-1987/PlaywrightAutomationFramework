# Sanity pipeline: runs only on schedule and does not trigger on push or PR.
# Uses Docker and publishes JUnit + HTML reports from Playwright.

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

schedules:
  - cron: '6 14 * * *'   # Run daily at 17:00 UTC
    displayName: 'Daily sanity schedule'
    branches:
      include:
        - main
    always: true

variables:
  CONTAINER_IMAGE: playwright-docker
  REPORT_DIR: $(System.DefaultWorkingDirectory)/playwright-report
  JUNIT_FILE: $(System.DefaultWorkingDirectory)/results.xml

steps:
- checkout: self

- script: |
    docker build -t $(CONTAINER_IMAGE) .
  displayName: 'Build Playwright Docker image'

- script: |
    mkdir -p "$(REPORT_DIR)"
    docker run --rm \
      -v "$(System.DefaultWorkingDirectory):/app" \
      -w /app \
      $(CONTAINER_IMAGE) \
      npx playwright test --project=chrome --grep "@sanity" --reporter=list,junit=results.xml,html=playwright-report
  displayName: 'Run sanity tests inside Docker'

- task: PublishTestResults@2
  - cron: '10 13 * * *'   # Run daily at 13:10 UTC (06:40 PM IST)
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/results.xml'
    failTaskOnFailedTests: false
  condition: succeededOrFailed()

- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright HTML report artifact'
  inputs:
    targetPath: '$(REPORT_DIR)'
    artifact: 'playwright-report'
  condition: succeededOrFailed()
